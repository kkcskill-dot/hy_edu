<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2026 세브란스 간호사 3급 승진고시 공식 학습 센터</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <!-- 단일 표준 Vue 테마만 사용 (themeable과 충돌 제거) -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    /* --------------------------------------------------
       2026 YUHS Professional LMS Design System
       - 완벽한 중앙 정렬 (화면 쏠림 해결)
       - 글자 색상 대비 100% 가독성 보장
       - 단어 단위 줄바꿈 (word-break: keep-all)
    -------------------------------------------------- */
    :root {
      --theme-color: #003876;
    }

    /* 전역 한국어 단어 단위 줄바꿈: "안녕하/세요" 방지 */
    *, *::before, *::after {
      box-sizing: border-box;
      word-break: keep-all !important;
      overflow-wrap: break-word !important;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      letter-spacing: -0.025em;
      background-color: #f8fafc;
      color: #1f2937;
      line-height: 1.8;
    }

    /* ==================================================
       1. Top Global Navigation Bar (상단 고정 헤더)
    ================================================== */
    .global-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 54px;
      background: #003876;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 999;
      box-shadow: 0 2px 10px rgba(0, 40, 85, 0.2);
    }
    .header-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 16px;
      color: #ffffff !important;
      text-decoration: none;
    }
    .header-badge {
      background: #fde047;
      color: #002855;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 12px;
      white-space: nowrap;
    }
    .header-stats {
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .progress-pill {
      background: rgba(255, 255, 255, 0.16);
      color: #ffffff;
      padding: 5px 14px;
      border-radius: 16px;
      font-weight: 600;
      white-space: nowrap;
    }

    /* ==================================================
       2. Sidebar Styling (좌측 목차)
    ================================================== */
    .sidebar {
      top: 54px !important;
      height: calc(100vh - 54px) !important;
      background-color: #ffffff !important;
      border-right: 1px solid #e2e8f0 !important;
      width: 320px !important;
      padding: 20px 14px 60px !important;
      box-shadow: 2px 0 6px rgba(0,0,0,0.02);
    }
    .app-name-link {
      font-size: 17px !important;
      font-weight: 800 !important;
      color: #003876 !important;
      padding: 10px 0 !important;
      display: block !important;
      text-align: center;
    }
    .sidebar-nav ul {
      padding-left: 0 !important;
      margin: 0 !important;
    }
    .sidebar-nav li {
      margin: 4px 0 !important;
      font-size: 14px !important;
      line-height: 1.5 !important;
    }
    .sidebar-nav strong {
      display: block !important;
      margin-top: 22px !important;
      margin-bottom: 8px !important;
      font-size: 12px !important;
      color: #003876 !important;
      font-weight: 800 !important;
      letter-spacing: 0.02em !important;
      padding-left: 8px !important;
      border-left: 3px solid #003876;
    }
    .sidebar-nav a {
      border-radius: 6px !important;
      padding: 8px 12px !important;
      transition: all 0.15s ease !important;
      color: #334155 !important;
      display: block !important;
      text-decoration: none !important;
    }
    .sidebar-nav a:hover {
      background-color: #f1f5f9 !important;
      color: #003876 !important;
      font-weight: 600 !important;
    }
    .sidebar-nav li.active > a {
      background-color: #e0ecf8 !important;
      color: #003876 !important;
      font-weight: 800 !important;
      border-left: 3px solid #003876 !important;
    }

    /* ==================================================
       3. Main Content Layout (★ 완벽한 중앙 정렬)
    ================================================== */
    .content {
      top: 54px !important;
      left: 320px !important;
      right: 0 !important;
      position: absolute !important;
      min-height: calc(100vh - 54px) !important;
      background-color: #f8fafc !important;
      padding: 30px 40px 100px !important;
    }

    /* 컨텐츠 박스를 화면 중앙에 배치 */
    .markdown-section {
      max-width: 960px !important;
      margin: 0 auto !important;
      padding: 36px 44px !important;
      background: #ffffff !important;
      border-radius: 14px !important;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04) !important;
      border: 1px solid #e2e8f0 !important;
    }

    /* ==================================================
       4. Text Visibility Fix (★ 글씨 색상 100% 해결)
    ================================================== */
    /* 강의 상단 히어로 박스 */
    .lecture-header-box {
      background: linear-gradient(135deg, #002855 0%, #004b99 100%) !important;
      color: #ffffff !important;
      padding: 28px 32px !important;
      border-radius: 12px !important;
      margin-bottom: 32px !important;
      box-shadow: 0 6px 18px rgba(0, 40, 85, 0.16) !important;
    }
    .lecture-header-box * {
      color: #ffffff !important; /* 모든 자식 요소 흰색 강제 */
    }
    .lecture-header-box .lecture-badge {
      display: inline-block !important;
      background: #fde047 !important;
      color: #002855 !important;
      font-size: 12px !important;
      font-weight: 800 !important;
      padding: 4px 10px !important;
      border-radius: 6px !important;
      margin-bottom: 12px !important;
    }
    .lecture-header-box h2 {
      color: #ffffff !important;
      border: none !important;
      margin: 0 0 12px 0 !important;
      padding: 0 !important;
      font-size: 24px !important;
      font-weight: 800 !important;
    }
    .lecture-header-box p {
      color: #f1f5f9 !important;
      font-size: 15px !important;
      margin: 0 !important;
      line-height: 1.65 !important;
    }
    .lecture-header-box strong {
      color: #fde047 !important; /* 강조 볼드는 선명한 골드 옐로우 */
      font-weight: 800 !important;
    }

    /* ==================================================
       5. Step Roadmap Cards (아스키 아트 박스 대체)
    ================================================== */
    .step-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 24px 0 36px;
      flex-wrap: wrap;
    }
    .step-card {
      flex: 1;
      min-width: 220px;
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-top: 4px solid #003876;
      border-radius: 10px;
      padding: 18px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      text-align: center;
    }
    .step-num {
      display: inline-block;
      background: #e0ecf8;
      color: #003876;
      font-size: 11.5px;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 12px;
      margin-bottom: 8px;
    }
    .step-title {
      font-size: 16px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 6px;
    }
    .step-desc {
      font-size: 13px;
      color: #64748b;
      line-height: 1.4;
    }
    .step-arrow {
      font-size: 20px;
      color: #94a3b8;
      font-weight: 800;
    }

    /* ==================================================
       6. Course Cards Grid (인터랙티브 과목 카드)
    ================================================== */
    .course-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin: 24px 0 45px;
    }
    .course-card {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-top: 4px solid #003876;
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-decoration: none !important;
      color: inherit !important;
    }
    .course-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 24px rgba(0, 56, 118, 0.12);
      border-color: #003876;
    }
    .course-card .card-tag {
      font-size: 11.5px;
      font-weight: 800;
      color: #003876;
      background: #eef4fb;
      padding: 4px 9px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 12px;
    }
    .course-card h4 {
      font-size: 17px;
      font-weight: 700;
      color: #0f172a;
      margin: 0 0 10px 0;
      line-height: 1.4;
    }
    .course-card p {
      font-size: 13.5px;
      color: #475569;
      margin: 0 0 18px 0;
      line-height: 1.6;
    }
    .course-card .card-footer {
      font-size: 12.5px;
      font-weight: 700;
      color: #003876;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid #f1f5f9;
      padding-top: 12px;
      margin-top: auto;
    }

    /* ==================================================
       7. Tables & Callouts
    ================================================== */
    table {
      width: 100% !important;
      border-collapse: separate !important;
      border-spacing: 0 !important;
      margin: 24px 0 !important;
      border: 1px solid #cbd5e1 !important;
      border-radius: 8px !important;
      overflow: hidden !important;
      font-size: 14.5px !important;
    }
    th {
      background: #f1f5f9 !important;
      color: #002855 !important;
      font-weight: 700 !important;
      text-align: center !important;
      padding: 12px 14px !important;
      border-bottom: 1.5px solid #cbd5e1 !important;
    }
    td {
      padding: 11px 14px !important;
      border-bottom: 1px solid #e2e8f0 !important;
      line-height: 1.6 !important;
    }
    tr:last-child td {
      border-bottom: none !important;
    }
    tr:nth-child(even) td {
      background-color: #f8fafc !important;
    }
    tr:hover td {
      background-color: #f1f5f9 !important;
    }

    blockquote {
      background: #f8fafc !important;
      border-left: 4.5px solid #003876 !important;
      padding: 14px 20px !important;
      margin: 20px 0 !important;
      border-radius: 0 8px 8px 0 !important;
      color: #334155 !important;
    }

    /* Interactive Quiz Details */
    details {
      background: #f8fafc !important;
      border: 1.5px solid #cbd5e1 !important;
      border-radius: 8px !important;
      padding: 14px 18px !important;
      margin: 16px 0 24px !important;
      transition: all 0.2s ease !important;
    }
    details[open] {
      background: #eff6ff !important;
      border-color: #3b82f6 !important;
    }
    summary {
      font-weight: 700 !important;
      color: #1d4ed8 !important;
      cursor: pointer !important;
      user-select: none !important;
      outline: none !important;
    }

    /* Lesson Footer Navigation Bar */
    .lesson-footer-nav {
      margin-top: 50px;
      padding-top: 25px;
      border-top: 1.5px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .complete-btn {
      background: #003876;
      color: #ffffff !important;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 6px rgba(0, 56, 118, 0.2);
      transition: all 0.2s;
    }
    .complete-btn:hover {
      background: #002855;
      transform: translateY(-1px);
    }

    /* Mobile adjustments */
    @media (max-width: 900px) {
      .sidebar {
        left: -320px;
      }
      .content {
        left: 0 !important;
        padding: 20px 16px 80px !important;
      }
      .markdown-section {
        padding: 24px 20px !important;
      }
      .step-arrow {
        display: none;
      }
      .step-container {
        flex-direction: column;
      }
      .step-card {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <!-- Top Global Header -->
  <header class="global-header">
    <a class="header-logo" href="#/">
      <span>🏥 YUHS</span>
      <span>2026 간호사 3급 승진고시 공식 학습 센터</span>
      <span class="header-badge">공식 기출범위</span>
    </a>
    <div class="header-stats">
      <div class="progress-pill">
        <span>📖 학습 코스: 8강 완비</span>
      </div>
      <div class="progress-pill">
        <span>🎯 합격 목표: 90점+</span>
      </div>
    </div>
  </header>

  <div id="app">🏥 세브란스 간호사 3급 승진고시 공식 학습 센터를 불러오는 중입니다...</div>

  <script>
    window.$docsify = {
      name: '🏛️ 2026 승진고시 올패스',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      homepage: 'README.md',
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '🔍 규정, 조항, 빈출 키워드 검색',
        noData: '일치하는 학습 내용이 없습니다.',
        depth: 4
      },
      copyCode: {
        buttonText : '복사',
        errorText  : '오류',
        successText: '복사 완료'
      }
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
</body>
</html>
