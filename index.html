<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2026 세브란스 간호사 3급 승진고시 공식 학습 센터</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
  <style>
    /* --------------------------------------------------
       2026 YUHS Professional E-Learning Design System
       - 단어 단위 줄바꿈(word-break: keep-all) 전면 적용
       - 단어가 음절 중간에서 짤리지 않고 한 덩어리로 다음 줄 이동
    -------------------------------------------------- */
    :root {
      --theme-color: #003876;
      --base-color: #1f2937;
      --heading-color: #002855;
      --sidebar-width: 320px;
      --sidebar-nav-link-color: #374151;
      --sidebar-nav-link-color--active: #003876;
      --sidebar-nav-link-font-weight--active: 700;
      --sidebar-background: #f8fafc;
      --content-max-width: 1040px;
    }

    /* 전역 단어 단위 줄바꿈: "안녕하/세요" 방지 */
    *, *::before, *::after {
      box-sizing: border-box;
      word-break: keep-all !important;
      overflow-wrap: break-word !important;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      letter-spacing: -0.025em;
      background-color: #ffffff;
      color: #1f2937;
      line-height: 1.8;
      word-break: keep-all !important;
    }

    /* Top Global Header Bar */
    .global-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 52px;
      background: #003876;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0, 40, 85, 0.15);
      word-break: keep-all !important;
    }
    .header-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: -0.01em;
      word-break: keep-all !important;
    }
    .header-badge {
      background: #e0ac24;
      color: #002855;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 12px;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .header-stats {
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .progress-pill {
      background: rgba(255, 255, 255, 0.18);
      padding: 4px 12px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      white-space: nowrap;
    }

    /* Sidebar Refinement */
    .sidebar {
      top: 52px;
      height: calc(100vh - 52px);
      background-color: #f8fafc;
      border-right: 1px solid #e5e7eb;
      padding-top: 15px;
      word-break: keep-all !important;
    }
    .sidebar-nav ul {
      padding-left: 0 !important;
    }
    .sidebar-nav li {
      margin: 4px 0;
      font-size: 14px;
      word-break: keep-all !important;
    }
    .sidebar-nav strong {
      display: block;
      margin-top: 18px;
      margin-bottom: 6px;
      font-size: 11.5px;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding-left: 12px;
      word-break: keep-all !important;
    }
    .sidebar-nav a {
      border-radius: 6px;
      padding: 7px 12px !important;
      transition: all 0.15s ease;
      color: #374151;
      display: block;
      text-decoration: none;
      line-height: 1.5;
      word-break: keep-all !important;
    }
    .sidebar-nav a:hover {
      background-color: #eef2f6;
      color: #003876;
    }
    .sidebar-nav li.active > a {
      background-color: #e0ecf8 !important;
      color: #003876 !important;
      font-weight: 700;
      border-left: 3px solid #003876;
    }

    /* Content Area */
    .content {
      top: 52px;
      min-height: calc(100vh - 52px);
      padding-top: 20px;
    }
    .markdown-section {
      max-width: 1000px;
      padding: 30px 40px 80px;
      font-size: 16px;
      line-height: 1.85;
      word-break: keep-all !important;
    }

    /* Paragraphs and Lists: Keep-all */
    .markdown-section p,
    .markdown-section li,
    .markdown-section blockquote,
    .markdown-section span,
    .markdown-section div {
      word-break: keep-all !important;
      overflow-wrap: break-word !important;
    }

    /* Typography */
    .markdown-section h1 {
      font-size: 28px;
      font-weight: 800;
      color: #002855;
      margin-top: 10px;
      margin-bottom: 24px;
      border-bottom: 2px solid #003876;
      padding-bottom: 14px;
      word-break: keep-all !important;
    }
    .markdown-section h2 {
      font-size: 22px;
      font-weight: 700;
      color: #003876;
      margin-top: 48px;
      margin-bottom: 18px;
      border-bottom: 1.5px solid #e5e7eb;
      padding-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      word-break: keep-all !important;
    }
    .markdown-section h3 {
      font-size: 18px;
      font-weight: 600;
      color: #1e3a8a;
      margin-top: 32px;
      margin-bottom: 12px;
      word-break: keep-all !important;
    }

    /* Lecture Header Hero Box */
    .lecture-header-box {
      background: linear-gradient(135deg, #002855 0%, #004b99 100%);
      color: #ffffff;
      padding: 24px 28px;
      border-radius: 12px;
      margin-bottom: 32px;
      box-shadow: 0 4px 14px rgba(0, 40, 85, 0.12);
      word-break: keep-all !important;
    }
    .lecture-header-box .lecture-badge {
      display: inline-block;
      background: #e0ac24;
      color: #002855;
      font-size: 12px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 6px;
      margin-bottom: 10px;
      white-space: nowrap;
    }
    .lecture-header-box h2 {
      color: #ffffff !important;
      border: none !important;
      margin: 0 0 10px 0 !important;
      padding: 0 !important;
      font-size: 24px !important;
      word-break: keep-all !important;
    }
    .lecture-header-box p {
      color: #e2e8f0;
      font-size: 14.5px;
      margin: 0;
      line-height: 1.6;
      word-break: keep-all !important;
    }

    /* Course Cards on Dashboard */
    .course-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 20px;
      margin: 30px 0 45px;
    }
    .course-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-decoration: none !important;
      color: inherit !important;
      border-top: 4px solid #003876;
      word-break: keep-all !important;
    }
    .course-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0, 56, 118, 0.12);
      border-color: #003876;
    }
    .course-card .card-tag {
      font-size: 11.5px;
      font-weight: 700;
      color: #003876;
      background: #eef4fb;
      padding: 3px 8px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 10px;
      white-space: nowrap;
    }
    .course-card h4 {
      font-size: 17px;
      font-weight: 700;
      color: #111827;
      margin: 0 0 8px 0;
      line-height: 1.4;
      word-break: keep-all !important;
    }
    .course-card p {
      font-size: 13.5px;
      color: #4b5563;
      margin: 0 0 16px 0;
      line-height: 1.55;
      word-break: keep-all !important;
    }
    .course-card .card-footer {
      font-size: 12.5px;
      font-weight: 600;
      color: #003876;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid #f3f4f6;
      padding-top: 12px;
      margin-top: auto;
      white-space: nowrap;
    }

    /* Enhanced Data Tables with Keep-all */
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      margin: 24px 0;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      overflow: hidden;
      font-size: 14.5px;
      word-break: keep-all !important;
    }
    th {
      background: #f1f5f9;
      color: #002855;
      font-weight: 700;
      text-align: center;
      padding: 12px 14px;
      border-bottom: 1.5px solid #cbd5e1;
      word-break: keep-all !important;
    }
    td {
      padding: 11px 14px;
      border-bottom: 1px solid #e2e8f0;
      line-height: 1.6;
      word-break: keep-all !important;
    }
    tr:last-child td {
      border-bottom: none;
    }
    tr:nth-child(even) td {
      background-color: #f8fafc;
    }
    tr:hover td {
      background-color: #f1f5f9;
    }

    /* Interactive Quiz Details */
    details {
      background: #f8fafc;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      padding: 14px 18px;
      margin: 16px 0 24px;
      transition: all 0.2s ease;
      word-break: keep-all !important;
    }
    details[open] {
      background: #eff6ff;
      border-color: #3b82f6;
    }
    summary {
      font-weight: 700;
      color: #1d4ed8;
      cursor: pointer;
      user-select: none;
      outline: none;
      word-break: keep-all !important;
    }
    summary:hover {
      color: #1e40af;
      text-decoration: underline;
    }

    /* Bottom Navigation Bar */
    .lesson-footer-nav {
      margin-top: 60px;
      padding-top: 25px;
      border-top: 1.5px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      word-break: keep-all !important;
    }
    .complete-btn {
      background: #003876;
      color: #ffffff !important;
      padding: 10px 22px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 2px 6px rgba(0, 56, 118, 0.2);
      transition: all 0.2s;
      white-space: nowrap;
    }
    .complete-btn:hover {
      background: #002855;
      transform: translateY(-1px);
    }

    /* Mobile adjustments */
    @media (max-width: 768px) {
      .global-header {
        padding: 0 16px;
      }
      .header-stats {
        display: none;
      }
      .markdown-section {
        padding: 20px 18px 60px;
      }
      .course-grid {
        grid-template-columns: 1fr;
      }
      .lesson-footer-nav {
        flex-direction: column;
        align-items: stretch;
      }
      .complete-btn {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <!-- Top Global Header -->
  <header class="global-header">
    <div class="header-logo">
      <span>🏥 YUHS</span>
      <span>2026 간호사 3급 승진고시 공식 학습 센터</span>
      <span class="header-badge">공식 기출범위</span>
    </div>
    <div class="header-stats">
      <div class="progress-pill">
        <span>📖 학습 코스: 8강 완비</span>
      </div>
      <div class="progress-pill">
        <span>🎯 합격 목표: 90점+</span>
      </div>
    </div>
  </header>

  <div id="app">🏥 세브란스 간호사 3급 승진고시 공식 학습 센터를 불러오는 중입니다...</div>

      },
      copyCode: {
        buttonText : '복사',

        successText: '복사 완료'
      }
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
</body>
</html>
